name: Bug report
description: Something behaves incorrectly, crashes, or fails a check
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The fields below exist to turn "drifting feels wrong" into something reproducible.
        Include source revision, asset identity, and the exact command or input sequence.
        Source checks and rendered-game evidence answer different questions.

  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Godot with dev Rust extension
        - Godot with release Rust extension
        - Rust or Python source tests
        - exported macOS app
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: OS, compiler, and version
      description: "e.g. macOS 26, Apple Silicon, Rust 1.99.0, Godot 4.7.2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Exact reproduction steps
      description: Commands, key presses, scenario name, and tick if you know it.
      placeholder: |
        1. uv run --frozen python tools/game/dev.py check
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: dropdown
    id: headless
    attributes:
      label: Does it reproduce headlessly?
      description: Specify whether this is a source-test failure or a rendered runtime failure.
      options:
        - "Yes — it reproduces in a Rust or Python test"
        - "No — only in the running game"
        - "Not tried"
    validations:
      required: true

  - type: input
    id: first-bad
    attributes:
      label: First known bad commit
      description: Optional, but it usually shortens the investigation to minutes.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Attach relevant test output, replay input and result, runtime/content hashes,
        screenshots or video. Link reference-vault evidence for fidelity differences.
        Do not upload original disc assets or credentials.
