name: Native source quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source:
    name: Rust and Python source checks (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
      - name: Verify architecture and resolve pinned tools
        run: |
          test "$(uname -m)" = arm64
          rustup show
          rustc --version
          cargo --version
          uv --version
      # The repository toolchain file installs the minimal Rust toolchain plus
      # rustfmt and clippy. uv uses .python-version and the frozen project lock.
      # No Godot download, private asset preparation, or rendered scenario runs.
      - name: Check native sources
        run: uv run --frozen python tools/game/dev.py check
