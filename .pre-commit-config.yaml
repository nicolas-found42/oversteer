# Install explicitly: uv run --frozen pre-commit install
# Rust formatting is checked; Python hooks may rewrite sources.

repos:
  - repo: local
    hooks:
      - id: rustfmt-check
        name: Rust format (check only)
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/game/evidence/
      - id: end-of-file-fixer
        exclude: ^docs/game/evidence/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
