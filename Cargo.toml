[workspace]
members = ["crates/oversteer-core", "crates/oversteer-godot"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.clippy]
# Preserve recovered IEEE-754 constants and max/min NaN behavior.
excessive_precision = "allow"
manual_clamp = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
