# Standalone repository tooling; uv manages dependencies without installing a package.
[project]
name = "oversteer-devtools"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff==0.15.20", "pre-commit==4.7.0", { include-group = "assets" }]
assets = ["numpy==2.5.4", "Pillow==13.0.0"]
reference = [{ include-group = "assets" }]

[tool.ruff]
force-exclude = true
line-length = 100
target-version = "py313"
extend-exclude = [
    "tools/visual/node_modules",
    "build",
    "artifacts",
]

[tool.ruff.lint]
# Preserve the existing truncating zip behavior when raising the Python target.
ignore = ["B905"]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: undefined names, unused imports
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # flake8-bugbear: likely bugs
]
# UP (pyupgrade) is deliberately off. The scripts consistently use
# `from __future__ import annotations` with typing.Dict/List/Optional; modernising that is a
# real change to every file and belongs in its own reviewable commit, not in a lint rollout.

[tool.ruff.format]
quote-style = "double"
