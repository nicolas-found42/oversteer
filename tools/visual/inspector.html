<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Oversteer — source vehicle inspector</title>
<style>
:root{color-scheme:dark}body{margin:24px;background:#121923;color:#e6ecf4;font:14px/1.5 system-ui}h1{margin:0;font-size:24px}p{color:#9dacc0}#controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 0;position:sticky;top:0;background:#121923;z-index:2}input,select,button{background:#243247;color:inherit;border:1px solid #4b6381;border-radius:4px;padding:7px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#1c2838;border:1px solid #34455d;border-radius:8px;padding:16px}.card h2{font-size:16px;margin:0}.code{font:12px monospace;color:#8ebdf3}.stage{height:245px;display:grid;place-items:center;overflow:auto;background:#121b29;margin:12px 0;border-radius:4px}img{object-fit:contain}table{font-size:11px;table-layout:fixed;width:100%;word-break:break-word}td{padding:3px;color:#b8c7da}summary{cursor:pointer}#status{color:#9dacc0}
</style>
<h1>Source vehicle inspector</h1>
<p>Original mesh silhouettes, paint and liveries baked to 2D. Shared physical scale: 26.4 px/m at 1×. Physics values include documented estimates and labeled production-trim references.</p>
<div id="controls">
<label>Search <input id="search" type="search" placeholder="Name or model code"></label>
<label>Source <select id="group"><option value="">All sources</option><option>Ford Racing 2</option><option>Gran Turismo 4</option><option>Midnight Club 3</option><option>Midnight Club Los Angeles</option></select></label>
<label>Scale <input id="zoom" type="range" min="1" max="4" value="1" step="0.5"><span id="zoomv">1×</span></label>
<button id="previous">Previous</button><span id="page"></span><button id="next">Next</button><span id="shown"></span>
</div>
<div id="status">Loading source sprite evidence…</div><main id="grid"></main>
<script>
const $=id=>document.getElementById(id);
let DATA,page=0;
const pageSize=24;
function source(c){return c.id.startsWith('GT4_')?'Gran Turismo 4':c.id.startsWith('MC3_')?'Midnight Club 3':c.id.startsWith('MCLA_')?'Midnight Club Los Angeles':'Ford Racing 2'}
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function draw(){
 const query=$('search').value.toLowerCase(), group=$('group').value, zoom=Number($('zoom').value);
 const cars=DATA.cars.filter(c=>(c.id+' '+c.name).toLowerCase().includes(query)&&(!group||source(c)===group));
 const pages=Math.max(1,Math.ceil(cars.length/pageSize));page=Math.min(page,pages-1);
 $('zoomv').textContent=zoom+'×';$('shown').textContent=cars.length+' / '+DATA.cars.length+' vehicles';$('page').textContent=(page+1)+' / '+pages;
 $('previous').disabled=page===0;$('next').disabled=page===pages-1;$('grid').replaceChildren();
 for(const c of cars.slice(page*pageSize,(page+1)*pageSize)){
  const article=element('article',undefined,'card');article.dataset.id=c.id;
  article.append(element('h2',c.name),element('span',c.id,'code'));
  const stage=element('div',undefined,'stage'),img=element('img');img.src=c.image;img.alt=c.name;
  img.width=Math.round(c.image_span_m*26.4*zoom);img.height=img.width;stage.append(img);article.append(stage);
  article.append(element('p',source(c)+' · '+c.frame_count+' steering poses · '+c.frame_size+' px frame'));
  article.append(element('p','Reference length '+c.length_m.toFixed(2)+' m · mass '+Math.round(c.mass_kg)+' kg'));
  const details=element('details');details.append(element('summary','Physics parameters (facts, estimates and proxies)'));
  const table=element('table');for(const [key,value] of Object.entries(c.parameters)){const tr=element('tr');tr.append(element('td',key),element('td',String(value)));table.append(tr)}details.append(table);article.append(details);$('grid').append(article);
 }
}
for(const id of ['search','group'])$(id).addEventListener('input',()=>{page=0;draw()});$('zoom').addEventListener('input',draw);
$('previous').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};
fetch('cards.json').then(r=>{if(!r.ok)throw Error('cards.json: '+r.status);return r.json()}).then(d=>{
 if(d.format!=='source-mesh-sprites-v1'||!Array.isArray(d.cars))throw Error('Expected source-mesh sprite cards; regenerate the export.');
 DATA=d;window.OVERSTEER_DATA=d;$('status').textContent='904 retained cars and trucks. Excluded source families and ambient traffic do not participate. Per-field evidence: data/carmodels; image provenance: data/carmodels/sprites.json.';draw();
}).catch(e=>{$('status').textContent=e.message;console.error(e)});
</script>
</html>
